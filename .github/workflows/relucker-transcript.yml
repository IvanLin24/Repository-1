name: RELUCKER transcript extraction
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp and EJS
        run: python -m pip install -U "yt-dlp[default]"
      - name: Extract metadata and subtitles
        shell: bash
        run: |
          set -uxo pipefail
          mkdir -p out
          for CLIENT in web_safari mweb ios android_vr tv tv_simply web_embedded; do
            echo "===== trying $CLIENT ====="
            yt-dlp --skip-download --write-info-json --write-subs --write-auto-subs \
              --remote-components ejs:github \
              --extractor-args "youtube:player_client=$CLIENT" \
              --sub-langs "ru.*,ru,en.*" --sub-format "vtt/srt/best" \
              -o "out/%(id)s.%(ext)s" \
              "https://www.youtube.com/watch?v=OYGXUOcTrO8" && break
          done
          ls -lah out
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: relucker-OYGXUOcTrO8
          path: out/
          if-no-files-found: warn
