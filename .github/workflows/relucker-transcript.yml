name: RELUCKER transcript extraction
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp and PO token provider plugin
        run: |
          python -m pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
          docker run -d --name bgutil-provider -p 4416:4416 --init brainicism/bgutil-ytdlp-pot-provider:latest
          sleep 3
          docker ps
      - name: Extract metadata and subtitles with PO tokens
        shell: bash
        run: |
          set -uxo pipefail
          mkdir -p out
          yt-dlp -v \
            --skip-download --write-info-json --write-subs --write-auto-subs \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=mweb" \
            --sub-langs "ru.*,ru,en.*" --sub-format "vtt/srt/best" \
            -o "out/%(id)s.%(ext)s" \
            "https://www.youtube.com/watch?v=OYGXUOcTrO8" || true
          ls -lah out
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: relucker-OYGXUOcTrO8-pot
          path: out/
          if-no-files-found: warn
