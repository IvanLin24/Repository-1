name: RELUCKER transcript extraction
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp
      - name: Extract metadata and subtitles
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          yt-dlp --skip-download --write-info-json --write-subs --write-auto-subs \
            --sub-langs "ru.*,ru,en.*" --sub-format "vtt/srt/best" \
            -o "out/%(id)s.%(ext)s" \
            "https://www.youtube.com/watch?v=OYGXUOcTrO8" || true
          ls -lah out
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: relucker-OYGXUOcTrO8
          path: out/
          if-no-files-found: warn
